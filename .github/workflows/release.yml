name: Release

# Triggered by publishing a GitHub Release, so the tag is cut once and every artifact
# derives from it. `workflow_dispatch` exists so a release can be rehearsed on TestPyPI
# without consuming a version on the real index.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: What to do
        type: choice
        # A choice, not a boolean: `gh workflow run -f dry-run=false` sends the string
        # "false", and a non-empty string is easy to interpret as truthy. A named target
        # has no such ambiguity, and makes "upload to the real PyPI" an explicit verb.
        options:
          - build-only
          - image
          - testpypi
          - pypi
        default: build-only

permissions:
  contents: read

jobs:
  build:
    name: Build and attach distributions
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to attach artifacts to the release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Verify the tag matches the package versions
        # A tag that disagrees with pyproject.toml produces a release whose artifacts do
        # not match its own name, and PyPI cannot take an upload back.
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          core=$(python3 -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('packages/openstax-llm/pyproject.toml').read_text())['project']['version'])
          ")
          mcp=$(python3 -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('packages/openstax-llm-mcp/pyproject.toml').read_text())['project']['version'])
          ")
          echo "tag=$tag core=$core mcp=$mcp"
          if [ "$tag" != "$core" ] || [ "$tag" != "$mcp" ]; then
            echo "::error::tag '$tag' does not match package versions (core=$core, mcp=$mcp)"
            exit 1
          fi

      - name: Build each workspace member into its own directory
        # Separate directories matter: PyPI Trusted Publishing scopes a token per project
        # via the GitHub environment, so each project needs its own upload step.
        run: |
          uv build --package openstax-llm --out-dir dist/openstax-llm
          uv build --package openstax-llm-mcp --out-dir dist/openstax-llm-mcp

      - name: Check wheel metadata for PyPI blockers
        # A hard gate. PyPI rejects any distribution declaring a PEP 508 direct URL
        # dependency, irrevocably, and `twine check` does not detect it.
        run: >-
          uv run python scripts/check_wheel_metadata.py
          dist/openstax-llm/*.whl dist/openstax-llm-mcp/*.whl

      - name: Upload distributions as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Attach distributions to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/openstax-llm/* dist/openstax-llm-mcp/* --clobber

      - name: Summarize
        run: |
          count=$(find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')
          {
            echo "### Built ${count} artifacts"
            echo
            echo "Metadata gate: passed (no direct URL dependencies)."
            echo
            echo "Trigger: \`${{ github.event_name }}\`"
            echo "Target: \`${{ inputs.target || 'release' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-core:
    name: Publish openstax-llm to PyPI
    needs: build
    # Three independent switches, all required:
    #   * the metadata gate must have passed;
    #   * the repository variable must be set, so enabling uploads is a deliberate,
    #     auditable change and not a side effect of cutting a release;
    #   * the run must either be a real release or an explicit target=pypi dispatch.
    if: >-
      vars.PYPI_PUBLISH_ENABLED == 'true'
      && (github.event_name == 'release' || inputs.target == 'pypi')
    runs-on: ubuntu-latest
    # Must match the trusted publisher registered on PyPI for openstax-llm, and must DIFFER
    # from the MCP project's environment: PyPI's pending-publisher uniqueness constraint
    # covers (owner, repo, workflow, environment) and not the project name, so two projects
    # sharing all four cannot both be registered.
    environment:
      name: pypi-openstax-llm
      url: https://pypi.org/project/openstax-llm/
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing; no API token needed
      attestations: write # build provenance
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/openstax-llm/
          attestations: true
          # Uploading a version that already exists is an error, and a partially uploaded
          # release cannot be retried. Fail loudly rather than skipping.
          skip-existing: false

  publish-mcp:
    name: Publish openstax-llm-mcp to PyPI
    needs: build
    if: >-
      vars.PYPI_PUBLISH_ENABLED == 'true'
      && (github.event_name == 'release' || inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi-openstax-llm-mcp
      url: https://pypi.org/project/openstax-llm-mcp/
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/openstax-llm-mcp/
          attestations: true
          skip-existing: false

  publish-image:
    name: Publish the MCP container to GHCR
    needs: build
    # GHCR rather than Docker Hub. GITHUB_TOKEN needs no stored secret (Docker Hub needs an
    # account-scoped PAT, the same class of credential this repository removed from its PyPI
    # path), the package inherits the repository's provenance, and GHCR has no anonymous
    # pull cap — Docker Hub allows 100 unpulls per 6h per IP, which is a hard ceiling for a
    # tool meant to run on classroom and CI machines.
    #
    # Two switches, matching publish-core's pattern: the repository variable makes publishing
    # a deliberate, auditable change, and the run must be a real release or target=image.
    if: >-
      vars.CONTAINER_PUBLISH_ENABLED == 'true'
      && (github.event_name == 'release' || inputs.target == 'image')
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # provenance
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        # arm64 is emulated at build time. Required, not optional: the lock resolves
        # aarch64 wheels for lxml/cryptography/cffi, and every Apple-silicon user would
        # otherwise run an amd64 image under emulation.
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openstax-llm-mcp
          # Exactly three tags: the release version, the commit, and `latest`. `latest` is
          # enabled only for a real, non-prerelease GitHub Release, so it can never be
          # moved by a dispatch from an arbitrary commit, and never moves backwards.
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !contains(github.ref_name, '-') }}
          # `source` is the one label metadata-action cannot guess here: it derives the label
          # from the image name (`openstax-llm-mcp`), which is not the repository name
          # (`openstax-llm`), so the guessed link would 404 and orphan the package. The rest
          # (title/description/licenses/version/revision) come from the Dockerfile.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize
        run: |
          {
            echo "### Published ${{ steps.meta.outputs.version }} to GHCR"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.push.outputs.digest }}\` — pin deployments to it;"
            echo "tags are mutable on every registry."
            echo
            echo "Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-image:
    name: Pull the published container and run it
    needs: publish-image
    # Same switch as publish-image. Verification happens from a fresh runner against the
    # registry, because an image that was only ever built locally has not been proven to be
    # the thing a consumer pulls. This is the container equivalent of testpypi-verify.
    if: >-
      vars.CONTAINER_PUBLISH_ENABLED == 'true'
      && (github.event_name == 'release' || inputs.target == 'image')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Log in to GHCR
        # Authentication is not a workaround: a package created by GITHUB_TOKEN starts
        # private, so an anonymous pull would fail until the visibility is flipped by hand.
        # See the containers section of docs/PUBLISHING.md.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the digest that was just pushed
        run: |
          docker pull "$IMAGE"
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/openstax-llm-mcp@${{ needs.publish-image.outputs.digest }}

      - name: Check both console scripts survived packaging
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/openstax-llm-mcp@${{ needs.publish-image.outputs.digest }}
        run: |
          docker run --rm --entrypoint openstax-llm "$IMAGE" --version
          docker run --rm --entrypoint openstax-llm "$IMAGE" search calculus

      - name: Check the provenance labels
        # `source` is what links the GHCR package to this repository. Without it the
        # published image is an orphan that nobody can trace to a commit.
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/openstax-llm-mcp@${{ needs.publish-image.outputs.digest }}
        run: |
          label() { docker inspect --format "{{ index .Config.Labels \"$1\" }}" "$IMAGE"; }
          test "$(label org.opencontainers.image.source)" = "https://github.com/${{ github.repository }}" || {
            echo "::error::image is not linked to this repository"; label org.opencontainers.image.source; exit 1; }
          test "$(label org.opencontainers.image.version)" = "${{ needs.publish-image.outputs.version }}" || {
            echo "::error::image version label does not match the release"; exit 1; }
          test "$(label org.opencontainers.image.revision)" = "${{ github.sha }}" || {
            echo "::error::image revision label does not match the commit"; exit 1; }
          echo "labels ok: $(label org.opencontainers.image.version) @ $(label org.opencontainers.image.revision)"

      - name: Verify the server answers an MCP initialize over HTTP
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/openstax-llm-mcp@${{ needs.publish-image.outputs.digest }}
        run: |
          docker run -d --name mcp -p 127.0.0.1:8765:8765 "$IMAGE"

          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null -X POST http://127.0.0.1:8765/mcp \
              -H 'Content-Type: application/json' \
              -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release-verify","version":"0"}}}'; then
              echo "server is up"
              break
            fi
            sleep 2
          done

          response=$(curl -s -X POST http://127.0.0.1:8765/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release-verify","version":"0"}}}')

          echo "$response"
          echo "$response" | grep -q '"name":"openstax-llm"' || {
            echo "::error::unexpected initialize result"; docker logs mcp; exit 1; }

          docker rm -f mcp

      - name: Report whether anonymous pulls work yet
        # Warn-only on purpose. A GHCR package created by GITHUB_TOKEN is private until the
        # visibility is flipped by hand, and no workflow can flip it; a red job here would be
        # permanent noise for a state CI cannot fix. Once the package is public, this step
        # proves the path a consumer actually takes.
        continue-on-error: true
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/openstax-llm-mcp@${{ needs.publish-image.outputs.digest }}
        run: |
          docker logout ghcr.io
          docker pull "$IMAGE" || {
            echo "::warning::anonymous pull failed; is the GHCR package still private?"
            echo "Set it under Packages -> openstax-llm-mcp -> Package settings -> Change visibility."
            exit 1
          }
          echo "anonymous pull works: the image is publicly consumable"

      - name: Summarize
        run: |
          {
            echo "### Container verification passed"
            echo
            echo "Pulled \`${{ needs.publish-image.outputs.digest }}\` from ghcr.io, ran both"
            echo "console scripts, checked the OCI labels, and completed an MCP initialize."
            echo
            echo '```bash'
            echo "docker run --rm -p 8765:8765 \\"
            echo "  ghcr.io/${{ github.repository_owner }}/openstax-llm-mcp:${{ needs.publish-image.outputs.version }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  testpypi-core:
    name: Rehearse openstax-llm on TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    # Distinct environment per project here too. TestPyPI runs the same warehouse code, so
    # its pending-publisher uniqueness constraint covers
    # (owner, repo, workflow, environment) and not the project name. One shared `testpypi`
    # environment cannot carry two pending publishers, and the second registration would
    # fail with a generic error.
    environment:
      name: testpypi-openstax-llm
      url: https://test.pypi.org/project/openstax-llm/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish openstax-llm to TestPyPI
        # Deliberately NOT continue-on-error. A rehearsal that stays green while uploading
        # nothing is worse than no rehearsal: it manufactures false confidence.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/openstax-llm/
          # Re-running a rehearsal is normal, and the version is disposable here.
          skip-existing: true

  testpypi-mcp:
    name: Rehearse openstax-llm-mcp on TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi-openstax-llm-mcp
      url: https://test.pypi.org/project/openstax-llm-mcp/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - name: Publish openstax-llm-mcp to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/openstax-llm-mcp/
          skip-existing: true

  testpypi-verify:
    name: Verify the TestPyPI rehearsal
    needs: [testpypi-core, testpypi-mcp]
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Confirm both projects actually landed on TestPyPI
        # Independent of the action's own exit status: ask the index. The JSON API is the
        # right probe here because /simple/ can lag ~45s behind an upload on TestPyPI, so a
        # single-shot /simple/ check reports false negatives.
        run: |
          version=$(python3 -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('packages/openstax-llm/pyproject.toml').read_text())['project']['version'])
          ")
          for pkg in openstax-llm openstax-llm-mcp; do
            found=0
            for attempt in $(seq 1 24); do
              if curl -sf "https://test.pypi.org/pypi/${pkg}/json" 2>/dev/null | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          releases = data.get('releases') or {}
          raise SystemExit(0 if '$version' in releases else 1)
          " 2>/dev/null; then
                echo "${pkg} ${version}: present on TestPyPI (check ${attempt})"
                found=1
                break
              fi
              sleep 5
            done
            if [ "$found" != "1" ]; then
              echo "::error::${pkg} ${version} not visible on TestPyPI after 120s"
              exit 1
            fi
          done

      - name: Confirm the simple index serves them (what an installer reads)
        # The install below also exercises this, but failing here names the cause directly.
        run: |
          for pkg in openstax-llm openstax-llm-mcp; do
            for attempt in $(seq 1 24); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://test.pypi.org/simple/${pkg}/")
              [ "$code" = "200" ] && break
              sleep 5
            done
            if [ "$code" != "200" ]; then
              echo "::error::https://test.pypi.org/simple/${pkg}/ returned HTTP ${code} after 120s"
              exit 1
            fi
            echo "${pkg}: simple index serving (HTTP 200)"
          done

      - name: Install the MCP package from TestPyPI and run it
        # The real proof: a consumer's install path. openstax-llm resolves from TestPyPI
        # (just uploaded); openstax-md resolves from the real PyPI.
        run: |
          version=$(python3 -c "
          import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('packages/openstax-llm-mcp/pyproject.toml').read_text())['project']['version'])
          ")
          uv venv /tmp/verify
          uv pip install --python /tmp/verify/bin/python \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "openstax-llm-mcp==${version}"

          # Both console scripts must exist and start.
          /tmp/verify/bin/openstax-llm --version
          /tmp/verify/bin/openstax-llm-mcp --version

          # And the server must complete a real MCP handshake over stdio.
          {
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}'
            sleep 1
            printf '%s\n' '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            sleep 1
            printf '%s\n' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'
            sleep 2
          } | /tmp/verify/bin/openstax-llm-mcp --log-level ERROR | tee /tmp/handshake.jsonl

          grep -q '"name":"openstax-llm"' /tmp/handshake.jsonl || { echo "::error::bad initialize result"; exit 1; }
          grep -q '"search_catalog"' /tmp/handshake.jsonl || { echo "::error::tools/list missing search_catalog"; exit 1; }

      - name: Summarize the rehearsal
        run: |
          {
            echo "### TestPyPI rehearsal passed"
            echo
            echo "Both projects uploaded, verified present on the index by version, and"
            echo "\`openstax-llm-mcp\` installed and completed an MCP handshake from TestPyPI."
            echo
            echo "Install it yourself with:"
            echo '```bash'
            echo "uv venv /tmp/tp && uv pip install --python /tmp/tp/bin/python \\"
            echo "  --index-url https://test.pypi.org/simple/ \\"
            echo "  --extra-index-url https://pypi.org/simple/ openstax-llm-mcp"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
