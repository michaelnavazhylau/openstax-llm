[project]
name = "openstax-llm"
version = "0.1.0"
description = "LLM dataset preparation, pedagogical semantic chunking, and RAG ingestion from OpenStax textbooks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Michael Navazhylau", email = "mikipux7@gmail.com" }
]
keywords = ["openstax", "rag", "chunking", "llm", "textbook", "dataset", "latex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "openstax-md @ git+https://github.com/michaelnavazhylau/openstax-md.git",
]

[project.urls]
Homepage = "https://github.com/michaelnavazhylau/openstax-llm"
Repository = "https://github.com/michaelnavazhylau/openstax-llm"
Issues = "https://github.com/michaelnavazhylau/openstax-llm/issues"

[project.scripts]
openstax-llm = "openstax_llm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Declared explicitly rather than relying on hatchling's name-based heuristic: this keeps
# metadata generation independent of the source tree being present, which is what lets the
# Dockerfile resolve dependencies in a layer that copies only the manifests.
[tool.hatch.build.targets.wheel]
packages = ["src/openstax_llm"]

[tool.hatch.metadata]
allow-direct-references = true
