[project]
name = "openstax-llm-mcp"
version = "0.1.0"
description = "Model Context Protocol server exposing openstax-llm pedagogical textbook chunking"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Michael Navazhylau", email = "mikipux7@gmail.com" }
]
keywords = ["openstax", "mcp", "model-context-protocol", "rag", "chunking", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Kept as an abstract range on purpose: a PEP 508 direct URL reference here
    # would make this distribution permanently unpublishable to PyPI.
    "openstax-llm>=0.1.0",
    "mcp>=2.0.0,<3",
]

[project.urls]
Homepage = "https://github.com/michaelnavazhylau/openstax-llm"
Repository = "https://github.com/michaelnavazhylau/openstax-llm"
Issues = "https://github.com/michaelnavazhylau/openstax-llm/issues"

[project.scripts]
openstax-llm-mcp = "openstax_llm_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# See the note in packages/openstax-llm/pyproject.toml: declaring this keeps metadata
# generation independent of the source tree being present.
[tool.hatch.build.targets.wheel]
packages = ["src/openstax_llm_mcp"]

# Resolve the sibling package from the workspace during development. This is a uv
# concern only; the published metadata keeps the abstract `openstax-llm>=0.1.0`.
[tool.uv.sources]
openstax-llm = { workspace = true }
